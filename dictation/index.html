<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditado</title>
<style>
  :root {
    --bg: #14141a;
    --fg: #f2f2f5;
    --dim: #8b8b96;
    --line: #2c2c36;
    --accent: #7048e8;
    --bad: #e24b4a;
    /* Verde só do jogo 5: "componente certo, esperando os outros". Precisa ser
       um terceiro estado — o roxo já quer dizer "acertou e acabou". */
    --mark: #2ea043;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    /* Sem rolagem elástica horizontal na página: o carrossel é quem rola. */
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  footer {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line);
    /* Acima do conteúdo, para o menu suspenso não ficar por baixo dele. */
    position: relative; z-index: 20;
  }
  #count { font-size: 13px; color: var(--dim); }
  button {
    font: inherit; font-size: 13px; color: var(--fg);
    background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px;
  }
  button:disabled { opacity: .4; }

  /* Menu ⋮: tira o Exportar do caminho, mantendo-o a um toque. */
  #menu-wrap { position: relative; }
  #menu-btn {
    border-color: transparent; color: var(--dim);
    font-size: 18px; line-height: 1; padding: 6px 10px; min-width: 40px;
  }
  #menu {
    /* Abre para CIMA: o menu fica no rodapé, então para baixo sairia da tela. */
    position: absolute; right: 0; bottom: calc(100% + 6px);
    background: #1c1c24; border: 1px solid var(--line);
    border-radius: 10px; padding: 4px; min-width: 190px;
  }
  #menu button {
    display: block; width: 100%; text-align: left;
    border: 0; border-radius: 7px; padding: 11px 12px; font-size: 14px;
  }
  #menu button:active { background: #262633; }

  /* Carrossel: scroll-snap nativo = swipe de graça, sem JS de gesto. */
  #track {
    display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* Impede que o gesto horizontal vire navegação de histórico no Chrome. */
    overscroll-behavior-x: contain;
    touch-action: pan-x;
  }
  #track::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; min-width: 100%;
    scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .slide img { display: block; width: 100%; height: auto; }
  .slide.done { outline: 2px solid var(--accent); outline-offset: -2px; }

  nav {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  nav button { min-width: 44px; }
  #pos { font-size: 13px; color: var(--dim); min-width: 74px; text-align: center; }

  form { padding: 10px 12px; }
  #answer {
    width: 100%; font: inherit; font-size: 17px; color: var(--fg);
    background: #1c1c24; border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px;
  }
  #answer:focus { outline: none; border-color: var(--accent); }
  #answer[readonly] { border-color: var(--line); }
  #answer.ok, .opt.ok { border-color: var(--accent); background: #1e1a2e; }
  /* Feedback de erro: animação CSS pura, o compositor cuida — nada de JS por frame.
     Uma regra só para os dois casos: nos jogos 1 e 6 quem erra é o campo, nos de
     montar é o botão tocado — e errar tem de ser a mesma coisa em todos. */
  #answer.bad, .opt.bad {
    border-color: var(--bad); background: #2a1719;
    animation: shake .28s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* Grid de opções dos jogos 2 e 3.
     max-height em vez de transformar o body em coluna flex: assim o grid nunca
     engole a página, e — mais importante — nunca aparece com altura zero quando
     a imagem é alta. O documento continua rolando como sempre. */
  #grid {
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px;
    padding: 4px 12px 12px;
    /* Teto inicial; fitGrid() ajusta ao espaço que sobra de verdade. */
    max-height: 38vh; max-height: 38dvh; overflow-y: auto;
  }
  .opt { min-height: 44px; font-size: 16px; padding: 8px 12px; }
  /* Jogo 3: um ideograma sozinho a 16px é ilegível no celular — e, ao contrário
     do pinyin, aqui o traço É a informação. Cabe crescer porque o rótulo tem
     sempre um caractere só. */
  .opt.char { font-size: 30px; line-height: 1.15; min-width: 58px; padding: 6px 10px; }
  /* Jogos 4 e 5: o rótulo é uma frase inteira (uma tradução, ou a decomposição
     com as glossárias), então cada opção ocupa a linha toda e alinha à
     esquerda — lado a lado elas viram um bloco ilegível. */
  .opt.wide { flex: 1 1 100%; text-align: left; font-size: 14px; line-height: 1.3; }
  /* Jogo 5: componente já encontrado, esperando os outros do mesmo caractere. */
  .opt.mark { border-color: var(--mark); background: #122417; }
  .opt.gone { display: none; }

  /* Glossa do jogo 5. No desktop sai de graça pelo title; no celular não existe
     hover, então o toque longo mostra este balão — sem ele a glossa ficaria
     invisível justamente onde o ditado é jogado. */
  #tip {
    position: absolute; z-index: 30; pointer-events: none;
    background: #1c1c24; border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px; font-size: 13px; color: var(--fg); max-width: 70vw;
  }

  #msg { padding: 0 12px 12px; font-size: 13px; color: var(--dim); min-height: 18px; }

  #boot { padding: 28px 20px; text-align: center; color: var(--dim); }
  #boot p { margin: 0 0 14px; }
  #boot input[type=file] { display: none; }
  #boot label {
    display: inline-block; font-size: 14px; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px;
  }
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="boot">
  <p id="boot-msg">Carregando…</p>
  <label for="pick">Carregar index.json</label>
  <input id="pick" type="file" accept=".json,application/json">
  <p style="margin-top:14px; font-size:12px;">Só na primeira vez neste aparelho.</p>
</div>

<div id="app" class="hide">
  <div id="track"></div>

  <nav>
    <button id="prev" type="button" aria-label="Anterior">‹</button>
    <span id="pos">—</span>
    <button id="next" type="button" aria-label="Próxima">›</button>
  </nav>

  <form id="form" autocomplete="off">
    <input id="answer" type="text" placeholder="Digite a frase"
           autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" enterkeyhint="done" lang="zh">
  </form>
  <div id="msg"></div>
  <div id="grid" class="hide"></div>
  <div id="tip" class="hide"></div>

  <footer>
    <span id="count">—</span>
    <div id="menu-wrap">
      <button id="menu-btn" type="button" aria-label="Mais opções"
              aria-expanded="false" aria-haspopup="true">⋮</button>
      <div id="menu" class="hide" role="menu">
        <button id="export" type="button" role="menuitem">Exportar index.json</button>
      </div>
    </div>
  </footer>
</div>

<!-- DICTATION_DATA: make_bundle.py substitui esta linha por um <script> que
     define window.__DICTATION__ com as imagens embutidas. Não remover. -->

<script>
(function () {
  "use strict";

  var SRC = "source/";
  var JSON_URL = SRC + "index.json";

  var el = {
    boot: document.getElementById("boot"),
    bootMsg: document.getElementById("boot-msg"),
    pick: document.getElementById("pick"),
    app: document.getElementById("app"),
    track: document.getElementById("track"),
    count: document.getElementById("count"),
    pos: document.getElementById("pos"),
    prev: document.getElementById("prev"),
    next: document.getElementById("next"),
    form: document.getElementById("form"),
    answer: document.getElementById("answer"),
    msg: document.getElementById("msg"),
    grid: document.getElementById("grid"),
    tip: document.getElementById("tip"),
    exportBtn: document.getElementById("export"),
    menuBtn: document.getElementById("menu-btn"),
    menu: document.getElementById("menu")
  };

  var items = [];      // [{index, source, sentence, done, game, words|chars|masked, opts}]
  var at = 0;          // posição atual NO ARRAY (não é o campo index)
  var storeKey = "";   // chave de progresso, isolada por coleção

  // ── Persistência ────────────────────────────────────────────────────────────
  // Toda página file:// compartilha o mesmo localStorage, então duas coleções em
  // duas pastas colidiriam. A chave carrega uma impressão digital dos dados.
  function fingerprint(list) {
    var s = list.length + "|";
    for (var i = 0; i < list.length; i++) s += list[i].source + " ";
    var h = 5381;
    for (var j = 0; j < s.length; j++) h = ((h * 33) ^ s.charCodeAt(j)) >>> 0;
    return h.toString(36);
  }

  function ls(k, v) {                       // get/set tolerante (modo privado etc.)
    try {
      if (v === undefined) return localStorage.getItem(k);
      localStorage.setItem(k, v);
    } catch (e) { return null; }
  }

  // O progresso é indexado pelo NOME DO ARQUIVO, não pela posição: regerar a
  // coleção em outra ordem não embaralha o que já foi feito.
  function loadProgress() {
    var raw = ls(storeKey);
    if (!raw) return;
    var done;
    try { done = JSON.parse(raw); } catch (e) { return; }
    if (!done) return;
    for (var i = 0; i < items.length; i++) {
      if (done[items[i].source]) items[i].done = true;
    }
  }

  function saveProgress() {
    var done = {};
    for (var i = 0; i < items.length; i++) {
      if (items[i].done) done[items[i].source] = 1;
    }
    ls(storeKey, JSON.stringify(done));
  }

  // ── Render ──────────────────────────────────────────────────────────────────
  function build() {
    // Substitui, não acumula: start() pode rodar de novo (ex.: o usuário escolhe
    // um index.json depois de a página já ter carregado um), e sem isso os
    // slides antigos ficariam pendurados junto dos novos.
    el.track.textContent = "";
    var frag = document.createDocumentFragment();
    for (var i = 0; i < items.length; i++) {
      var d = document.createElement("div");
      d.className = "slide" + (items[i].done ? " done" : "");
      var img = document.createElement("img");
      img.src = items[i].img || (SRC + items[i].source);
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      d.appendChild(img);
      frag.appendChild(d);
    }
    el.track.appendChild(frag);
  }

  function refresh() {
    var n = 0;
    for (var i = 0; i < items.length; i++) if (items[i].done) n++;
    el.count.textContent = n + "/" + items.length + " feitas";
    el.pos.textContent = (at + 1) + " / " + items.length;
    el.prev.disabled = at <= 0;
    el.next.disabled = at >= items.length - 1;
    var slides = el.track.children;
    for (var k = 0; k < slides.length; k++) {
      slides[k].classList.toggle("done", !!items[k].done);
    }
  }

  function goTo(i) {
    if (i < 0 || i >= items.length) return;
    stashDraft();
    at = i;
    var slide = el.track.children[i];
    if (slide) {
      // Atribuição direta de scrollLeft, de propósito:
      //  - scrollIntoView rolaria a PÁGINA junto, tirando o campo da tela;
      //  - scrollTo({behavior:"smooth"}) foi observado como no-op em algum
      //    ambiente, o que deixava o rótulo andar sem a imagem andar.
      // A atribuição sempre chega ao destino; o scroll-snap dá o acabamento.
      el.track.scrollLeft = slide.offsetLeft;
    }
    syncCurrent();
  }

  // Enquanto o dedo arrasta, mantém `at` em sincronia com o que está na tela.
  var scrollTimer = null;
  el.track.addEventListener("scroll", function () {
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      var w = el.track.clientWidth || 1;
      var i = Math.round(el.track.scrollLeft / w);
      if (i !== at && i >= 0 && i < items.length) { stashDraft(); at = i; syncCurrent(); }
    }, 90);
  }, { passive: true });

  // ── Validação ───────────────────────────────────────────────────────────────
  // O alvo é parâmetro porque quem erra muda de jogo para jogo: no 1 é o campo,
  // no 2 e no 3 é o botão tocado. O feedback em si é o mesmo nos três.
  function flash(node, cls) {
    node.classList.remove("bad", "ok");
    void node.offsetWidth;                   // reinicia a animação
    node.classList.add(cls);
    el.msg.textContent = "";
    setTimeout(function () { node.classList.remove(cls); }, 900);
  }

  // ── Grids dos jogos 2 a 5, e os jogos de teclado ────────────────────────
  // As funções abaixo são a única coisa que separa os jogos de montar: o 2
  // trabalha em palavras rotuladas por pinyin, o 3 em caracteres, e o 5 é o 3
  // com outro rótulo. O 4 é de clique único e não passa por elas.

  // Os jogos de TECLADO: o 1 digita a frase do zero, o 6 completa a palavra que
  // veio como `*`. Os dois usam o campo em vez do grid, guardam rascunho e
  // validam no Enter — daí o predicado, em vez de `=== 1 || === 6` em seis
  // lugares.
  function digita(cur) {
    return !cur || cur.game === 1 || cur.game === 6;
  }

  function pieces(cur) {
    return cur.game === 2 ? cur.words.length : cur.sentence.length;
  }

  function optCount(cur) {
    return cur.game === 2 ? cur.opts.length : cur.chars.length;
  }

  function optLabel(cur, i) {
    return cur.game === 2 ? cur.opts[i].p : cur.chars[i];
  }

  // O que o botão escreve se for a vez dele; null no distrator.
  function optWrites(cur, i) {
    return cur.game === 2 ? (cur.opts[i].w || null) : cur.chars[i];
  }

  function expected(cur) {
    return cur.game === 2
      ? (cur.words[cur.step] || null)
      : (cur.sentence.charAt(cur.step) || null);
  }

  // Classe extra do botão: no 3 e no 5 o rótulo é um glifo só, e glifo pequeno
  // não se distingue de outro.
  function optClass(cur) {
    return (cur.game === 3 || cur.game === 5) ? " char" : "";
  }

  function buildGrid() {
    var cur = items[at];
    el.grid.textContent = "";
    el.grid.style.maxHeight = "";
    el.tip.classList.add("hide");
    if (digita(cur)) {
      el.grid.classList.add("hide");
      el.answer.readOnly = false;
      // O jogo 6 já abre com a frase mascarada no campo: placeholder ali seria
      // texto que ninguém chega a ver.
      el.answer.placeholder = (cur && cur.game === 6) ? "" : "Digite a frase";
      return;
    }
    // readonly nos jogos de montar: o teclado do Android subiria por cima do
    // grid, e o que fosse digitado à mão sairia de sincronia com os botões.
    el.answer.readOnly = true;
    el.answer.placeholder = "";
    // Vindo de um jogo 1, o campo está com o foco: sem largá-lo o teclado
    // continuaria de pé, cobrindo justamente o grid que se vai usar agora.
    el.answer.blur();

    var frag = document.createDocumentFragment();
    var i, b;
    if (cur.game === 4) {
      // Clique único: cinco traduções, uma por linha. Não há `step` nem botão
      // que some — o item se resolve ou não com um toque.
      for (i = 0; i < cur.options.length; i++) {
        b = document.createElement("button");
        b.type = "button";
        b.className = "opt wide";
        b.textContent = cur.options[i];
        b.setAttribute("data-i", i);
        frag.appendChild(b);
      }
    } else if (cur.game === 5) {
      // Um botão por componente. `mark` é o verde de "já achei este, faltam os
      // outros do mesmo caractere"; `gone` são os caracteres já fechados.
      for (i = 0; i < cur.comps.length; i++) {
        b = document.createElement("button");
        b.type = "button";
        b.className = "opt char"
                    + (cur.used.indexOf(i) >= 0 ? " gone" : "")
                    + (cur.marked.indexOf(i) >= 0 ? " mark" : "");
        b.textContent = cur.comps[i].c;
        // Componente sem glossa existe no dado (要 vem como "西 () + 女 ()").
        // Sem este guarda o hover abriria um balão vazio.
        if (cur.comps[i].g) b.title = cur.comps[i].g;
        b.setAttribute("data-i", i);
        frag.appendChild(b);
      }
    } else {
      for (i = 0; i < optCount(cur); i++) {
        b = document.createElement("button");
        b.type = "button";
        b.className = "opt" + optClass(cur)
                    + (cur.used.indexOf(i) >= 0 ? " gone" : "");
        b.textContent = optLabel(cur, i);
        b.setAttribute("data-i", i);
        frag.appendChild(b);
      }
    }
    el.grid.appendChild(frag);
    el.grid.classList.remove("hide");
    fitGrid();
  }

  // Altura do grid medida, não chutada. Uma fração fixa da tela (38dvh) não sabe
  // quão alta é a imagem: a mesma regra que sobrava numa legenda de uma linha
  // empurrava o rodapé para fora da tela numa de duas — e o contador some
  // justamente nos jogos cujos botões ocupam mais espaço.
  function fitGrid() {
    if (el.grid.classList.contains("hide")) return;
    var topo = el.grid.getBoundingClientRect().top;
    var rodape = document.querySelector("footer").offsetHeight;
    var sobra = window.innerHeight - topo - rodape - 8;
    el.grid.style.maxHeight = Math.max(110, Math.round(sobra)) + "px";
  }

  // Girar o aparelho muda tudo que fitGrid mediu.
  window.addEventListener("resize", fitGrid);

  // Guarda o que está no campo ANTES de trocar de frase. Só os jogos de teclado
  // precisam: nos de montar o campo é reconstruído a partir de `step`.
  function stashDraft() {
    var cur = items[at];
    if (cur && digita(cur)) cur.draft = el.answer.value;
  }

  // Repõe o campo com o que pertence à frase atual — e só com isso. O campo é
  // um por página, mas o conteúdo é de cada frase: sem isto, a frase que o jogo
  // 3 acabou de montar continuaria no campo do jogo 1 seguinte, que abriria já
  // "preenchido" com a resposta de outra imagem.
  function restoreAnswer() {
    var cur = items[at];
    if (!cur) return;
    if (cur.game === 4) {
      // O jogo 4 não monta nada: o campo só recebe a tradução ao acertar.
      el.answer.value = cur.done ? cur.answer : "";
      return;
    }
    if (cur.game === 1) {
      el.answer.value = cur.draft || "";
      // O jogo 1 é digitar: chegar nele já com o cursor no campo poupa um toque,
      // e é o que faz o teclado subir sozinho depois do avanço automático.
      el.answer.focus();
      el.answer.select();
      return;
    }
    if (cur.game === 6) {
      // O campo abre com a frase e o buraco: é ele que mostra o mandarim, já
      // que a imagem deste jogo só tem a tradução.
      el.answer.value = cur.draft || cur.masked;
      el.answer.focus();
      // Com a máscara ainda intacta, deixar o `*` SELECIONADO faz a primeira
      // tecla substituí-lo — senão, no celular, seria preciso mirar o cursor no
      // meio da frase e apagar à mão. Mexeu, o cursor vai para o fim: refazer a
      // seleção por cima do que a pessoa digitou apagaria o trabalho dela.
      var buraco = el.answer.value === cur.masked ? cur.masked.indexOf("*") : -1;
      if (buraco >= 0) el.answer.setSelectionRange(buraco, buraco + 1);
      else el.answer.setSelectionRange(el.answer.value.length, el.answer.value.length);
      return;
    }
    el.answer.value = cur.game === 2
      ? cur.words.slice(0, cur.step).join("")
      : cur.sentence.slice(0, cur.step);
  }

  function syncCurrent() {
    refresh();
    buildGrid();
    restoreAnswer();
  }

  // Fecha a frase: marca feita, deixa o acerto aparecer e vira a página. A
  // pausa curta é o prêmio — sem ela o último acerto mal é visto.
  function finish() {
    var cur = items[at];
    if (!cur.done) { cur.done = true; saveProgress(); }
    refresh();
    var nxt = at + 1;
    setTimeout(function () {
      if (nxt < items.length) goTo(nxt);
      else { syncCurrent(); el.msg.textContent = "Fim da coleção."; }
    }, 350);
  }

  // Componentes que o caractere atual ainda pede. Compara por VALOR e COM
  // REPETIÇÃO: há caractere com o mesmo radical duas vezes (多 = 夕 + 夕) e há
  // radical repetido entre caracteres diferentes da frase.
  function restantes(cur) {
    var falta = cur.needs[cur.step].slice();
    for (var k = 0; k < cur.marked.length; k++) {
      var pos = falta.indexOf(cur.comps[cur.marked[k]].c);
      if (pos >= 0) falta.splice(pos, 1);
    }
    return falta;
  }

  function pick(i, btn) {
    var cur = items[at];
    if (digita(cur)) return;                 // sem grid: a jogada é o teclado

    // Jogo 4: um toque resolve a frase, então não há `step` nem botão que some.
    if (cur.game === 4) {
      if (cur.options[i] !== cur.answer) { flash(btn, "bad"); return; }
      el.answer.value = cur.answer;        // confirmação antes de virar a página
      flash(el.answer, "ok");
      btn.classList.add("ok");
      finish();
      return;
    }

    // Jogo 5: cada botão é um COMPONENTE, e um caractere só fecha quando todos
    // os seus forem achados — em qualquer ordem.
    if (cur.game === 5) {
      var falta = restantes(cur);
      var onde = falta.indexOf(cur.comps[i].c);
      if (onde < 0) { flash(btn, "bad"); return; }
      cur.marked.push(i);
      btn.classList.add("mark");
      if (cur.marked.length < cur.needs[cur.step].length) return;

      // Fechou: os verdes somem e o caractere entra no campo.
      for (var m = 0; m < cur.marked.length; m++) {
        cur.used.push(cur.marked[m]);
        var alvo = el.grid.querySelector('[data-i="' + cur.marked[m] + '"]');
        if (alvo) { alvo.classList.remove("mark"); alvo.classList.add("gone"); }
      }
      cur.marked = [];
      el.answer.value += cur.sentence.charAt(cur.step);
      cur.step++;
      flash(el.answer, "ok");
      if (cur.step < cur.sentence.length) return;
      finish();
      return;
    }

    var want = expected(cur);
    var gives = optWrites(cur, i);
    // Compara por VALOR, não por identidade: uma palavra (ou caractere) que se
    // repete na frase pode ser resolvida por qualquer um dos seus botões.
    if (!want || gives !== want) {
      flash(btn, "bad");
      return;
    }

    cur.used.push(i);
    cur.step++;
    btn.classList.add("gone");
    el.answer.value += gives;
    flash(el.answer, "ok");
    if (cur.step < pieces(cur)) return;
    finish();
  }

  el.grid.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest(".opt") : null;
    if (!b || b.classList.contains("gone")) return;
    // Se o toque virou "segurar para ver a glossa", ele não é uma jogada. A
    // flag é zerada no próximo touchstart, não aqui.
    if (segurou) return;
    pick(parseInt(b.getAttribute("data-i"), 10), b);
  });

  // ── Glossa por toque longo ──────────────────────────────────────────────
  // No desktop o `title` do botão já resolve. No celular não há hover, então
  // segurar o botão mostra o balão. De propósito SEM preventDefault no
  // touchstart: ele mataria o clique, e o clique é a jogada. Quem separa os
  // dois é a flag `segurou`, que o handler de clique consome.
  var segurou = false, timerTip = null;

  function mostraTip(btn) {
    var texto = btn.getAttribute("title");
    if (!texto) return;                       // componente sem glossa
    el.tip.textContent = texto;
    el.tip.classList.remove("hide");
    var r = btn.getBoundingClientRect();
    var largura = el.tip.offsetWidth;
    var x = r.left + window.scrollX + (r.width - largura) / 2;
    x = Math.max(6, Math.min(x, document.documentElement.clientWidth - largura - 6));
    el.tip.style.left = Math.round(x) + "px";
    el.tip.style.top = Math.round(r.top + window.scrollY - el.tip.offsetHeight - 6) + "px";
  }

  function escondeTip() {
    el.tip.classList.add("hide");
  }

  function cancelaTimer() {
    if (timerTip) { clearTimeout(timerTip); timerTip = null; }
  }

  el.grid.addEventListener("touchstart", function (e) {
    // Todo toque novo começa limpo. Zerar aqui, e não no handler de clique,
    // porque um toque longo que termina FORA do botão não gera clique nenhum —
    // e a flag presa engoliria a próxima jogada de verdade.
    segurou = false;
    escondeTip();
    var b = e.target && e.target.closest ? e.target.closest(".opt") : null;
    if (!b || b.classList.contains("gone") || !b.getAttribute("title")) return;
    cancelaTimer();
    timerTip = setTimeout(function () {
      timerTip = null;
      segurou = true;
      mostraTip(b);
    }, 400);
  }, { passive: true });

  ["touchend", "touchmove", "touchcancel"].forEach(function (ev) {
    el.grid.addEventListener(ev, cancelaTimer, { passive: true });
  });

  function submit() {
    var cur = items[at];
    if (!cur) return;
    if (!digita(cur)) return;                // nos jogos de montar não há o que enviar
    // Comparação literal, como pedido: nada de trim nem normalização.
    if (el.answer.value === cur.sentence) {
      if (!cur.done) { cur.done = true; saveProgress(); }
      el.answer.value = "";
      cur.draft = "";                        // acertou: o rascunho morreu junto
      flash(el.answer, "ok");
      var nxt = at + 1;                      // próximo índice da lista
      if (nxt < items.length) goTo(nxt);
      else { refresh(); el.msg.textContent = "Fim da coleção."; }
    } else {
      flash(el.answer, "bad");
    }
  }

  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    submit();
  });

  // IME chinês: o primeiro Enter confirma o candidato do teclado. Tratá-lo como
  // envio validaria texto pela metade — daí o guarda de isComposing.
  el.answer.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    submit();
  });

  el.prev.addEventListener("click", function () { goTo(at - 1); });
  el.next.addEventListener("click", function () { goTo(at + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target === el.answer) return;
    if (e.key === "ArrowLeft") goTo(at - 1);
    if (e.key === "ArrowRight") goTo(at + 1);
  });

  // ── Menu ⋮ ──────────────────────────────────────────────────────────────────
  function setMenu(open) {
    el.menu.classList.toggle("hide", !open);
    el.menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  el.menuBtn.addEventListener("click", function (e) {
    e.stopPropagation();                        // não conta como clique "fora"
    setMenu(el.menu.classList.contains("hide"));
  });
  // Fecha ao tocar em qualquer outro lugar, ou com Esc.
  document.addEventListener("click", function () { setMenu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") setMenu(false);
  });

  // ── Exportar ────────────────────────────────────────────────────────────────
  el.exportBtn.addEventListener("click", function () {
    setMenu(false);
    var out = [];
    for (var i = 0; i < items.length; i++) {
      out.push({
        index: items[i].index,
        source: items[i].source,
        sentence: items[i].sentence,
        done: !!items[i].done
      });
    }
    var blob = new Blob([JSON.stringify(out, null, 2)], {
      type: "application/json;charset=utf-8"
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "index.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  // ── Início ──────────────────────────────────────────────────────────────────
  // Aceita o texto do index.json OU uma lista já pronta (modo bundle).
  function parse(textOrList) {
    var data = typeof textOrList === "string" ? JSON.parse(textOrList) : textOrList;
    if (!Array.isArray(data)) throw new Error("o index.json deve ser uma lista");
    var out = [];
    for (var i = 0; i < data.length; i++) {
      var e = data[i] || {};
      if (!e.source) continue;
      var it = {
        index: typeof e.index === "number" ? e.index : i + 1,
        source: String(e.source),
        sentence: typeof e.sentence === "string" ? e.sentence : "",
        done: e.done === true,
        // No bundle a imagem vem embutida como data URI; sem ela, resolve por
        // caminho relativo (que só funciona em http:// ou file://).
        img: typeof e.img === "string" && e.img ? e.img : null,
        game: 1,
        step: 0,          // pedaços já colocados nesta frase
        used: [],         // índices de opts já gastos
        marked: [],       // jogo 5: componentes verdes do caractere em curso
        draft: ""         // o que foi digitado aqui (jogos 1 e 6)
      };
      // Os jogos 2 a 6 dependem de dados que só o make_bundle monta. Sem eles
      // — index.json antigo, servido por pasta — o item cai no jogo 1, que é o
      // que a página sempre soube fazer.
      if (e.game === 2 && e.opts && e.opts.length && e.words && e.words.length) {
        it.game = 2;
        it.words = e.words;
        it.opts = e.opts;
      } else if (e.game === 3 && e.chars && e.chars.length) {
        it.game = 3;
        it.chars = e.chars;
      } else if (e.game === 4 && e.options && e.options.length && e.answer) {
        it.game = 4;
        it.options = e.options;
        it.answer = e.answer;
      } else if (e.game === 5 && e.needs && e.needs.length && e.comps) {
        it.game = 5;
        it.needs = e.needs;      // por caractere, os componentes que ele pede
        it.comps = e.comps;      // os botões, já embaralhados
      } else if (e.game === 6 && typeof e.masked === "string" && e.masked) {
        it.game = 6;
        it.masked = e.masked;    // a frase com a palavra trocada por "*"
      }
      out.push(it);
    }
    if (!out.length) throw new Error("nenhuma entrada utilizável no index.json");
    return out;
  }

  function start(text, cacheIt) {
    items = parse(text);
    storeKey = "subrim.dictation." + fingerprint(items);
    if (cacheIt) ls("subrim.dictation.data." + fingerprint(items), text);
    loadProgress();
    build();

    // Abre na primeira não feita; se todas estiverem feitas, na primeira.
    var first = 0;
    for (var i = 0; i < items.length; i++) {
      if (!items[i].done) { first = i; break; }
    }
    el.boot.classList.add("hide");
    el.app.classList.remove("hide");
    goTo(first);   // o foco, quando cabe, sai do restoreAnswer
  }

  function fail(reason) {
    el.bootMsg.textContent = reason;
  }

  // 1) fetch (funciona se servido por HTTP). 2) cache de uma escolha anterior.
  // 3) o usuário escolhe o arquivo — único caminho possível em file://.
  function boot() {
    // 0) Bundle: dados E imagens embutidos neste próprio arquivo. É o único
    // caminho que funciona quando o Android abre a página via content://, onde
    // não existe diretório contra o qual um caminho relativo resolva.
    // Não cacheia: os data URIs estourariam a cota do localStorage.
    if (window.__DICTATION__) {
      start(window.__DICTATION__, false);
      return;
    }
    // Um cache anterior é reaproveitado sem depender de fetch.
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("subrim.dictation.data.") === 0) {
        try { start(ls(k), false); return; } catch (e) { /* cache ruim, segue */ }
      }
    }
    fetch(JSON_URL, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (t) { start(t, true); })
      .catch(function () {
        fail("Não deu para ler o index.json sozinho (arquivo local).");
      });
  }

  el.pick.addEventListener("change", function () {
    var f = el.pick.files && el.pick.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try { start(String(fr.result), true); }
      catch (e) { fail("index.json inválido: " + e.message); }
    };
    fr.onerror = function () { fail("Falha ao ler o arquivo."); };
    fr.readAsText(f, "utf-8");
  });

  try { boot(); } catch (e) { fail("Erro ao iniciar: " + e.message); }
})();
</script>
</body>
</html>
