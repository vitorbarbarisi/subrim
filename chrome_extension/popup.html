<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Subrim</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff;
      --fg: #1f1e1d;
      --muted: #6b6a66;
      --border: rgba(0, 0, 0, 0.12);
      --ok: #3b6d11;
      --bad: #a32d2d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #262624;
        --fg: #f0eee6;
        --muted: #a8a69e;
        --border: rgba(255, 255, 255, 0.14);
        --ok: #97c459;
        --bad: #f09595;
      }
    }
    body {
      margin: 0;
      width: 280px;
      padding: 14px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    header img { width: 20px; height: 20px; border-radius: 4px; }
    header strong { font-weight: 500; }
    #server { margin-left: auto; font-size: 12px; color: var(--muted); }
    #server.ok { color: var(--ok); }
    #server.bad { color: var(--bad); }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      cursor: pointer;
    }
    .range { padding: 6px 0; }
    .range div { display: flex; justify-content: space-between; }
    .range span { color: var(--muted); }
    input[type="range"] { width: 100%; margin: 6px 0 0; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
    #hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    .host { display: flex; align-items: center; gap: 6px; padding: 0 0 8px; }
    .host span { font-size: 13px; color: var(--muted); }
    .host input {
      flex: 1;
      min-width: 0;
      padding: 4px 6px;
      font: inherit;
      font-size: 13px;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    #hostDot { font-size: 14px; color: var(--muted); }
    #hostDot.ok { color: var(--ok); }
    #hostDot.bad { color: var(--bad); }
    h2 { font-size: 14px; font-weight: 500; margin: 4px 0 2px; }
    #videoStatus { color: var(--muted); margin: 0 0 8px; }
    button {
      width: 100%;
      padding: 6px 10px;
      font: inherit;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: var(--border); }
    .sub { color: var(--muted); }
    .provider { padding: 6px 0; }
    .seg {
      display: flex;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .seg label { flex: 1; justify-content: center; padding: 4px 0; font-size: 13px; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label:has(input:checked) { background: var(--fg); color: var(--bg); }
    #providerStatus { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    #providerStatus.ok::before { content: "● "; color: var(--ok); }
    #providerStatus.bad::before { content: "● "; color: var(--bad); }
  </style>
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <strong>Subrim</strong>
    <span id="server">verificando…</span>
  </header>
  <div class="host">
    <span>Servidor</span>
    <input id="serverHost" placeholder="192.168.0.42" spellcheck="false" autocomplete="off">
    <span id="hostDot" title="">●</span>
  </div>
  <label>Legendas subrim <input type="checkbox" id="enabled"></label>
  <hr>
  <div class="provider">
    <div>Tradução por</div>
    <div class="seg">
      <label><input type="radio" name="provider" value="deepseek">DeepSeek</label>
      <label><input type="radio" name="provider" value="local">LLM local</label>
    </div>
    <p id="providerStatus"></p>
  </div>
  <label>Tradução da frase no topo <input type="checkbox" id="topTranslation"></label>
  <label>Várias linhas <input type="checkbox" id="multiline"></label>
  <label>Caixa opaca <input type="checkbox" id="opaqueBox"></label>
  <label>Clicar na palavra marca como dominada <input type="checkbox" id="clickToMaster"></label>
  <div class="range">
    <div>Tamanho da fonte <span id="fontScaleOut">100%</span></div>
    <input type="range" id="fontScale" min="60" max="160" step="10">
  </div>
  <p id="hint" hidden>Informe o IP da máquina que roda <code>python subrim_server.py</code> e tecle Enter.</p>
  <hr>
  <h2>Este vídeo</h2>
  <p id="videoStatus">Abra um vídeo do YouTube.</p>
  <button id="transcribe" hidden>Transcrever com Whisper</button>
  <label class="sub">Transcrever automaticamente <input type="checkbox" id="autoTranscribe"></label>
  <script src="render.js"></script>
  <script src="popup.js"></script>
</body>
</html>
